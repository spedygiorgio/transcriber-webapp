name: Build Rust WASM & Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git credentials for private transcriber-core (if private)
        if: ${{ secrets.CORE_REPO_TOKEN != '' }}
        run: |
          git config --global url."https://x-access-token:${{ secrets.CORE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust & wasm32-unknown-unknown
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack & CMake/Clang (for whisper.cpp)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake clang llvm
          cargo install wasm-pack

      - name: Compile transcriber-core to WebAssembly (+simd128)
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
          GGML_NATIVE: "OFF"
        run: |
          wasm-pack build transcriber-wasm --target web --release --out-dir ../pkg

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
