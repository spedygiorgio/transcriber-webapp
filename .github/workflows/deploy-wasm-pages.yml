name: Deploy GitHub Pages (static)

# La webapp è 100% statica: la trascrizione gira nel browser con transformers.js
# (Whisper ONNX su WebGPU/WASM). Non serve alcuna compilazione Rust/WASM né il
# kernel transcriber-core: non c'è nulla da buildare, si pubblica la root così com'è.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
