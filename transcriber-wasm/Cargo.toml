[package]
name = "transcriber-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bridge for transcriber-core with zero-API local execution"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
transcriber-core = { git = "https://github.com/spedygiorgio/transcriber-core", branch = "main", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
